server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Aceita o site tanto na raiz quanto em /lp/lppocket/ (com ou sem prefixo removido pelo proxy)
  rewrite ^/lp/lppocket/?(.*)$ /$1 last;

  # Sempre revalida HTML/CSS/JS para o visitante nunca ver versão antiga
  location ~* \.(html|css|js)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
